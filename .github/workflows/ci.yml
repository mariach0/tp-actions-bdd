name: CI (Python, PHP, Java, JS)

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash db/setup.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        working-directory: python-app
      - run: pytest -v
        working-directory: python-app

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash db/setup.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql
          tools: composer, phpunit
      - run: composer install --no-interaction
        working-directory: php-app
      - run: vendor/bin/phpunit tests
        working-directory: php-app

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash db/setup.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java-app/pom.xml
      - run: mvn -B package
        working-directory: java-app

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash db/setup.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: node-app/package-lock.json
      - run: npm ci
        working-directory: node-app
      - run: npm test
        working-directory: node-app
